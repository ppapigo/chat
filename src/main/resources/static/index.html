<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Echo Message Tester</title>
    <style>
        label{
            display: block;
            margin-top: .75rem;
            font-weight: normal;
        }
        #log {
            background: black;
            color: #ddd;
            padding: .75rem;
            overflow: auto;
            white-space: pre-wrap;
            font-family: ui-monospace, monospace;
            font-size: .85rem;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>Chat STOMP Console</h1>
    <p>board에서 로그인해 받은 access token을 붙여넣고 Connect한다. 로그아웃 후
        Send하면 Error(LOGIN_REQUIRED)가 발생한다</p>

    <label for ="token"> access token: </label>
    <input id="token" placeholder="egh...">
    <div>
        <button id="connect">CONNECT</button>
        <button id="subscribe" disabled>SUBSCRIBE /topic/echo</button>
        <button id="disconnect" disabled>DISCONNECT</button>

    </div>

    <label for="content">message</label>
    <input id="content" value="hello">
    <button id="send" disabled> SEND /topic/echo</button>

    <label>log</label>
    <div id="log"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        const log = (line) => {
            $('log').textContent += `[${new Date().toLocaleTimeString()}] ${line}\n`;
            $('log').scrollTop = $('log').scrollHeight;
        }
        const setConnected = (on) =>{
            $('subscribe').disabled = !on;
            $('send').disabled = !on;

        }

        let client = null;
        const WS_BASE = 'ws://localhost:8092';
        const wsUrl = WS_BASE + '/ws';

        $('connect').onclick = () => {
          //  const wsUrl = (location.protocol === 'https:' ? 'wss://' :'ws://') +
           //     location.host+ '/ws';
            client = new StompJs.Client({
                brokerURL: wsUrl,

                connectHeaders: {
                    Authorization: 'Bearer ' + $('token').value.trim()
                },

                reconnectDelay: 0,

                onConnect: () => {
                    log('CONNECTED');
                    setConnected(true);
                },

                onStompError: (frame) => {
                    log(`ERROR Code=${frame.headers.code}
                        message=${frame.headers.message}`);
                    setConnected(false);
                },

                onWebSocketClose: () => {
                    log('WebSocket Closed');
                    setConnected(false);
                },

                debug: (msg) => {
                    if (msg.startsWith('>>>') || msg.startsWith('<<<')) {
                        log(msg);
                    }
                }
            });

            client.activate();
        };

        const  auth = () => ({Authorization: 'Bearer '+ $('token').value.trim() });
               $('subscribe').onclick = () => {
                   client.subscribe('/topic/echo', (message) => log('MESSAGE '+message.body),auth());
                   log('subscribed /topic/echo');
               }

               $('send').onclick = () => {
                   client.publish({
                       destination: '/app/echo',
                       body: JSON.stringify({content: $('content').value})
                   });
               }

               $('disconnect').onclick = () =>{
                   client.deactivate();
                   setConnected(false);
                   log('disconnect');
               }




    </script>
</body>
</html>
